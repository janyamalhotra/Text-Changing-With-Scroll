<title>meowmeowmeow</title>

<style>
:root{--pad:15px}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow-x:hidden}
section{position:relative;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.shade{position:absolute;inset:0}
#s0 .bg{background-image:linear-gradient(135deg,#d8c8ac,#8a7157)} #s0 .shade{background:rgba(0,0,0,.28)}
#s1 .bg{background-image:linear-gradient(160deg,#06121f,#0b2a3a)} #s1 .shade{background:rgba(0,10,25,.5)}
#s2 .bg{background-image:linear-gradient(160deg,#ffd75e,#ff8fb1)} #s2 .shade{background:rgba(40,0,60,.35)}
#s3 .bg{background-image:linear-gradient(200deg,#1b1b1b,#3a0000)} #s3 .shade{background:rgba(0,0,0,.12)}
#s4 .bg{background-image:linear-gradient(140deg,#4b1fa8,#ff5fd2)} #s4 .shade{background:rgba(20,0,50,.3)}

/* every layer is the SAME text, fixed, centered identically; only its variables differ */
.layer{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:0 var(--pad);pointer-events:none}
.t{--fs:9;--ls:0;--wght:400;--slnt:0;--r:0;--sway:0;
 margin:0 calc(var(--ls) * -1em) 0 0;white-space:nowrap;line-height:1;text-align:center;
 font-size:calc(var(--fs) * 1vw);letter-spacing:calc(var(--ls) * 1em)}
.ch{display:inline-block;--off:0;--k:0;
 transform:rotate(calc(var(--off) * var(--r) * 1deg + var(--k) * var(--sway) * 1deg))}
.a{font-family:Recursive,system-ui,sans-serif;font-variation-settings:"wght" var(--wght),"slnt" var(--slnt)}
.b{font-family:Doto,"Courier New",monospace;font-weight:900;color:rgb(190,240,255);
 text-shadow:0 0 .05em rgb(150,225,255),0 0 .2em rgba(60,170,255,.95),0 0 .5em rgba(40,140,255,.7)}
.c{font-family:Chewy,"Comic Sans MS",cursive;color:rgb(255,243,107);
 text-shadow:0 .06em 0 rgb(255,79,154),0 .12em 0 rgba(120,0,90,.5)}
.d{font-family:"Bowlby One",Impact,sans-serif;color:#fff;-webkit-text-stroke:.035em #fff;paint-order:stroke fill}
.layer.dl{mix-blend-mode:difference}
#ui{position:fixed;z-index:20;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);display:flex;gap:6px;align-items:center;font:11px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:6px 8px;border-radius:99px}
#ui button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;font:inherit}
#ui button.on{background:#fff;color:#000}
#hint{position:fixed;bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:11;color:#fff;font:12px/1 system-ui,sans-serif;letter-spacing:.3em;opacity:.75;pointer-events:none}

#s0 .shade{background:rgba(0,0,0,.38)}#s1 .shade{background:rgba(0,10,25,.42)}#s2 .shade{background:rgba(40,0,60,.4)}#s3 .shade{background:rgba(0,0,0,.08)}#s4 .shade{background:rgba(0,0,0,.4)}
#ui{display:none}

/* text visible by default, even before/without JS */
.layer.la{opacity:1}.layer.lb,.layer.lc,.layer.dl{opacity:0}
.a{--fs:8;--ls:.22;--wght:340;--slnt:-10;color:rgb(246,239,227);text-shadow:0 0 .35em rgba(0,0,0,.85),0 .03em .5em rgba(0,0,0,.6)}
.b{--fs:9.5;--ls:.04}.c{--fs:12;--ls:.01}.d{--fs:8.5;--ls:-.02}
#s0 .shade{background:radial-gradient(ellipse at center,rgba(0,0,0,.62),rgba(0,0,0,.35))}
#s3 .bg{filter:brightness(.5) contrast(1.15)}

/* v6: ONE text, ONE font (Recursive). Everything below is just its starting values; GSAP morphs them. */
.t{--fs:8;--ls:.22;--wght:340;--slnt:-10;--mono:0;--sw:0;--r:0;--sway:0;
 font-size:calc(var(--fs) * 1vw)}
.a{font-family:Recursive,system-ui,sans-serif;font-variation-settings:"wght" var(--wght),"slnt" var(--slnt),"MONO" var(--mono);
 color:rgb(246,239,227);text-shadow:0em 0em .35em rgba(0,0,0,.85),0em .03em .5em rgba(0,0,0,.6),0em 0em 0em rgba(0,0,0,0);
 -webkit-text-stroke:calc(var(--sw) * 1em) rgb(255,79,154);paint-order:stroke fill;font-weight:400}

/* v7: Comic Sans only. Size/height/thickness/rotation are plain numbers GSAP tweens. */
.t{--fs:10.5;--ls:0;--sx:1;--sy:1;--sw:0;--swing:0;font-size:calc(var(--fs) * 1vw)}
.a{font-family:"Comic Sans MS","Comic Sans","Comic Neue",cursive;font-weight:400;font-variation-settings:normal;
 color:#fff;text-shadow:0em 0em .1em rgba(0,0,0,.7),0em 0em .3em rgba(0,0,0,.7);
 -webkit-text-stroke:calc(var(--sw) * 1em) #fff;paint-order:stroke fill}
.ch{--k:0;--sg:1;--rot:0;
 transform:rotate(calc(var(--rot) * var(--sg) * 1deg + var(--k) * var(--swing) * var(--sg) * 1deg)) scale(var(--sx),var(--sy))}
#s2 .bg{filter:brightness(.55) saturate(.9)}#s2 .shade{background:rgba(30,0,50,.5)}#s4 .bg{filter:brightness(.6)}
</style></head><body>
<div id="ui"><span>add cat photo:</span><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<div id="hint">SCROLL ↓</div>
<div id="wrap">
<section id="s0"><div class="bg"></div><div class="shade"></div></section>
<section id="s1"><div class="bg"></div><div class="shade"></div></section>
<section id="s2"><div class="bg"></div><div class="shade"></div></section>
<section id="s3"><div class="bg"></div><div class="shade"></div></section>
<section id="s4"><div class="bg"></div><div class="shade"></div></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
// tweak these multipliers
const K={shrink:5, tall:15, thick:20, tilt:45};
const TEXT='meowmeowmeow';
const L=document.createElement('div');L.className='layer';
L.innerHTML='<h1 class="t a">'+[...TEXT].map((c,i)=>'<span class="ch" style="--sg:'+(i%2?1:-1)+'">'+c+'</span>').join('')+'</h1>';
document.body.appendChild(L);const h=L.firstChild;
const sh=a=>'0em 0em .1em rgba(0,0,0,'+a+'), 0em 0em .3em rgba(0,0,0,'+a+')';
const small=1/K.shrink, tall=small*K.tall, thickStroke=.003*K.thick;
const S=[
 /*1 normal, white*/        {'--sx':1,'--sy':1,'--sw':0,color:'rgb(255,255,255)',textShadow:sh(.7)},
 /*2 letters 5x smaller, same spots*/{'--sx':small,'--sy':small,'--sw':0,color:'rgb(255,255,255)',textShadow:sh(.7)},
 /*3 height x15*/           {'--sx':small,'--sy':tall,'--sw':0,color:'rgb(255,226,40)',textShadow:sh(1)},
 /*4 bold + thick x20, invert*/{'--sx':1.1,'--sy':tall,'--sw':thickStroke,color:'rgb(255,255,255)',textShadow:sh(0)}
];
function go(){
 // keep the word inside the 15px side padding
 gsap.set(h,{'--fs':10.5});const w=h.getBoundingClientRect().width;
 if(w>innerWidth-30)gsap.set(h,{'--fs':10.5*(innerWidth-30)/w*.97});
 gsap.set(h,S[0]);gsap.set(h,{'--swing':0});
 gsap.utils.toArray('.ch').forEach((c,i)=>gsap.fromTo(c,{'--k':-1},{'--k':1,duration:1.1,repeat:-1,yoyo:true,ease:'sine.inOut'}).progress((i%6)/12));
 const tl=gsap.timeline({defaults:{duration:1,ease:'power2.inOut',immediateRender:false},
  onUpdate(){L.style.mixBlendMode=tl.time()>2.5?'difference':'normal'},
  scrollTrigger:{trigger:'#wrap',start:'top top',end:'bottom bottom',scrub:1}});
 for(let i=1;i<4;i++)tl.fromTo(h,S[i-1],{...S[i]},i-1);
 // screen 4 -> 5: each letter swings +45, -45, +45, -45 (alternating direction per letter)
 const t=K.tilt,d=.2;
 tl.fromTo(h,{},{},3);
 [t,-t,t,-t].forEach((a,n)=>tl.to(gsap.utils.toArray('.ch'),{'--rot':a,duration:d,ease:'power1.inOut'},3+n*d));
 tl.to(gsap.utils.toArray('.ch'),{'--rot':0,duration:d,ease:'power1.inOut'},3+4*d);
 tl.fromTo(h,{'--swing':0},{'--swing':t,duration:d,ease:'power1.inOut'},3+4*d); // then keeps swinging back and forth
 gsap.to('#hint',{opacity:0,scrollTrigger:{trigger:'#s1',start:'top bottom',end:'top 60%',scrub:true}});
}
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]).then(go);
</script></body></html>
